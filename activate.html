<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b16"><title>Activate • TZR PAPA PROXY</title><link rel="stylesheet" href="{{ url_for('static', filename='css/tzr.css') }}"></head><body><div class="form-card shine"><div class="form-logo"><img class="brand-logo" src="{{ url_for('static', filename='img/tzr-logo.png') }}" alt="TZR PAPA"><div class="brand-text"><strong>TZR PAPA <span>PROXY</span></strong></div></div><div class="eyebrow">LICENSE CENTER</div><h1 class="form-title">Activate your access</h1><p class="sub">Enter your license key to unlock the premium workspace.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="POST" id="activateForm" autocomplete="on"><div class="field"><label>License key</label><input class="input" name="license_key" placeholder="TZRPAPA-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" autofocus required></div><div class="field"><label>Device ID <span class="muted">(optional)</span></label><input class="input" name="device_id" placeholder="Your device ID" autocomplete="off" inputmode="text"></div><button type="submit" class="btn" style="width:100%">Activate now <span>⚡</span></button></form><div style="margin-top:20px"><a class="muted" href="/user/">← Back to home</a></div></div><audio id="tzrMusic" preload="auto" autoplay loop playsinline muted src="{{ url_for('static', filename='audio/tzr-papa-theme.mp3') }}" style="display:none"></audio><div class="toast"></div><script src="{{ url_for('static', filename='js/tzr-ui.js')}}"></script></body></html>
