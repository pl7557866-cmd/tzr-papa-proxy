<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b16"><title>TZR PAPA PROXY • Admin</title><link rel="stylesheet" href="{{ url_for('static', filename='css/tzr.css') }}"></head><body><div class="form-card shine"><div class="form-logo"><img class="brand-logo" src="{{ url_for('static', filename='img/tzr-logo.png') }}" alt="TZR PAPA"><div class="brand-text"><strong>TZR PAPA <span>PROXY</span></strong></div></div><div class="eyebrow">SECURE ACCESS</div><h1 class="form-title">Welcome back</h1><p class="sub">Sign in to control licenses, users and proxy features.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="POST" id="adminLoginForm" autocomplete="on"><div class="field"><label>Username</label><input class="input" name="username" value="{{ request.form.get('username','') }}" placeholder="TZR-PAPA" autocomplete="username" autocapitalize="none" inputmode="text" autofocus required></div><div class="field"><label>Password</label><input class="input" type="password" name="password" placeholder="••••••••••••" autocomplete="current-password" inputmode="text" required></div><button type="submit" class="btn" style="width:100%;margin-top:8px">Sign in <span>→</span></button></form><div class="auth-note">Local admin access • TZR PAPA PROXY</div></div></body></html>
